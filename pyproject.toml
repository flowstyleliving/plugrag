[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugrag"
version = "0.1.0"
description = "Standalone local hybrid retrieval with a Python SDK, CLI and optional cited answers"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "requests>=2.32,<3.0",
  "beautifulsoup4>=4.12,<5.0",
  "tqdm>=4.66,<5.0",
  "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.7.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=8f8b3cfc53010a4b4a3c7ecb88c212e9decc4f5eeb6af75c3c803937d2d60947 ; platform_machine == 'x86_64' and sys_platform == 'linux' and python_version == '3.12'",
  "sentence-transformers>=2.7,<3.0",
  "chromadb>=1.5,<2.0",
  "tiktoken>=0.7,<1.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]
llm = ["openai>=2.14,<3.0"]
legacy = ["modal>=0.63,<1.0", "networkx>=3.0,<4.0", "lxml>=5.0,<6.0"]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "build>=1.0,<2.0"]

[project.scripts]
plugrag = "plugrag.cli:main"

[tool.setuptools.packages.find]
include = ["plugrag*", "lens_rag*"]
exclude = ["tests*"]
